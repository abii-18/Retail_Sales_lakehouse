name: Validate pipeline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Python lint
        run: ruff check airflow glue
      - name: Parse dbt without warehouse access
        run: dbt parse --no-partial-parse --project-dir dbt/retail_sales_lakehouse --profiles-dir .github/dbt
